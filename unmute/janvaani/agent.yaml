# JanVaani as an Unmute package. `unmute validate` checks it, `unmute deploy`
# pushes it to SLNG as the hosted agent that the app's "Live Call" button
# connects to over WebRTC. Nothing in here names a framework: switch
# targets.yaml to livekit or pipecat and the same agent compiles to code.
version: 1

name: janvaani
entry_agent: janvaani

agents:
  janvaani:
    instructions: prompt.md
    think: brain
    speak: hindi_voice
    tools:
      - end_call

secrets:
  - SLNG_API_KEY

models:
  think:
    brain:
      # On the slng target the driver joins provider/model into SLNG's hosted
      # model name (openai/gpt-4.1-mini:latest), billed to the SLNG project.
      description: SLNG-hosted GPT-4.1 mini; fast, cheap, good at Hinglish and code-mixed Indic text
      provider: openai
      model: "gpt-4.1-mini:latest"
  speak:
    hindi_voice:
      description: Sarvam Bulbul v3, Indian male voice, 11 Indic languages
      provider: slng
      model: "sarvam/bulbul:v3"
      voice: "shubh"
      params:
        world_part: in
    english_voice:
      description: Deepgram Aura 2 for English-only kiosks
      provider: slng
      model: "deepgram/aura:2"
      voice: "aura-2-thalia-en"
      params:
        world_part: in
  listen:
    ears:
      description: SLNG-hosted Deepgram Nova 3 Hindi. Saaras pinned to hi-IN still returned syllable salad on Live Call, so the Hindi specialist listens instead.
      provider: slng
      model: "slng/deepgram/nova:3-hi"
      params:
        world_part: in
        # Nova options the Agents API accepted on a probe PATCH. Do not set
        # `language` (reserved; the agent language "hi" is copied in) and do not
        # set detect_language. Saaras keys (language_code, mode) are not sent.
        # endpointing 500 waits through a short pause. The 10ms Nova default
        # cuts a sentence into fragments. high_vad_sensitivity false keeps
        # noise from becoming a turn. turn_pace stays patient in agent.json.
        smart_format: true
        punctuate: true
        high_vad_sensitivity: false
        endpointing: 500
  # No turn: block. `unmute validate` rejects pace and endpointing_delay on the
  # slng target. The Agents API still accepts turn_pace (snappy|balanced|patient);
  # build/slng/agent.json sets patient and push-agent.mjs sends it.

tools:
  - end_call

conversation:
  greeting:
    speaks_first: agent
    text: "नमस्ते, मैं जनवाणी हूँ। सरकारी योजना के लिए एक-एक सवाल पूछूँगी। आप कहाँ रहते हैं?"

channels:
  web:
    kind: realtime_audio

capacity:
  peak_sessions: 5
  max_sessions: 10
  avg_session_duration: 4m
